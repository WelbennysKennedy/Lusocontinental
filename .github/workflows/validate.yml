name: Validate site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: |
          for file in *.js scripts/*.mjs assets/*.js; do
            node --check "$file"
          done
      - run: npm run build
